; ---------------------------------------------------------------
; Alembic configuration for APEX
;
; The database URL is NOT stored here. It is read from application
; settings (APEX_DATABASE_URL) inside alembic/env.py, so migrations and
; the application can never disagree about which database they target,
; and no credentials live in a committed file.
; ---------------------------------------------------------------

[alembic]
script_location = alembic
prepend_sys_path = .

; Filenames sort chronologically and read meaningfully in a directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

version_path_separator = os

[post_write_hooks]
; Generated migrations are formatted and linted like any other source file.
hooks = ruff_format, ruff_lint

ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_lint.type = exec
ruff_lint.executable = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME

; ---------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

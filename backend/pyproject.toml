[project]
name = "apex-backend"
version = "0.1.0"
description = "APEX — enterprise knowledge, governance and intelligence platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "BLE"]
# S101: pytest relies on bare assert statements.
per-file-ignores = { "tests/*" = ["S101", "S105", "S106"], "alembic/versions/*" = ["N999"] }


[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

# boto3 and botocore ship no type information. Typed stubs exist
# (boto3-stubs), but the S3 client is held as Any behind our own ObjectStore
# protocol, so the stubs would add a large dependency for no checking we
# actually consume.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.config", "botocore.exceptions"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

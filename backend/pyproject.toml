[project]
name = "apex-backend"
version = "0.1.0"
description = "APEX — enterprise knowledge, governance and intelligence platform (backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "BLE"]
# S101: pytest relies on bare assert statements.
per-file-ignores = { "tests/*" = ["S101", "S105", "S106"], "alembic/versions/*" = ["N999"] }


[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

# boto3 and botocore ship no type information. Typed stubs exist
# (boto3-stubs), but the S3 client is held as Any behind our own ObjectStore
# protocol, so the stubs would add a large dependency for no checking we
# actually consume.
[[tool.mypy.overrides]]
module = ["boto3", "botocore.config", "botocore.exceptions"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


# ---------------------------------------------------------------
# Bounded-context boundaries, enforced rather than reviewed.
#
# Master Prompt §23: each context owns its data and interacts with others
# through services, APIs and events -- never by reaching in. Documentation
# alone does not survive contact with a deadline; a CI contract does.
#
# The contracts target each context's *domain* modules -- models, services,
# and the rules -- not its router. A router is an edge adapter: an audit
# endpoint must know which permission to require, so it legitimately composes
# Audit with Identity. The dependency rule is about who owns data and who makes
# decisions, not about which module wires an HTTP route. Stating it as "the
# whole package" would be stating it wrongly, and a contract that is wrong gets
# relaxed the first time it fires.
#
# **Writing to Audit is permitted from everywhere, by design.** ADR-0007 puts
# Audit outside the dependency graph precisely so every context can record what
# it did: "Audit depends on nothing ... and is written to by every context."
# Earlier revisions of these contracts forbade Storage and Events from importing
# Audit, which contradicted that ADR and would have left object deletion
# unaudited. What the contracts forbid is depending on a *peer* context.
# ---------------------------------------------------------------
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Platform is the control plane and depends on no bounded context"
type = "forbidden"
source_modules = ["app.platform"]
forbidden_modules = [
    "app.identity",
    "app.policy",
    "app.audit",
    "app.storage",
    "app.events",
]

[[tool.importlinter.contracts]]
name = "The Audit domain is written to by every context and depends on none"
type = "forbidden"
source_modules = [
    "app.audit.models",
    "app.audit.service",
    "app.audit.actions",
    "app.audit.immutability",
]
forbidden_modules = [
    "app.identity",
    "app.policy",
    "app.storage",
    "app.events",
]

[[tool.importlinter.contracts]]
name = "The Events domain depends on no peer bounded context"
type = "forbidden"
source_modules = [
    "app.events.envelope",
    "app.events.models",
    "app.events.outbox",
    "app.events.registry",
]
forbidden_modules = [
    "app.identity",
    "app.policy",
    "app.storage",
]

[[tool.importlinter.contracts]]
name = "The Storage domain does not reach into Identity, Policy or Events"
type = "forbidden"
source_modules = [
    "app.storage.models",
    "app.storage.backend",
    "app.storage.keys",
    "app.storage.locations",
]
forbidden_modules = [
    "app.identity",
    "app.policy",
    "app.events",
]

# ---------------------------------------------------------------
# APEX — local development stack
#
#   cp .env.example .env
#   docker compose up --build
#
# Frontend  http://localhost:5173
# Backend   http://localhost:8000  (docs at /docs)
# Postgres  localhost:5432
#
# Object storage (MinIO) joins the stack in Commit 008.
# ---------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-apex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apex} -d ${POSTGRES_DB:-apex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO's own registry. Docker Hub refuses anonymous pulls of minio/minio.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${APEX_S3_ACCESS_KEY:?set APEX_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${APEX_S3_SECRET_KEY:?set APEX_S3_SECRET_KEY in .env}
    ports:
      - "${APEX_S3_PORT:-9000}:9000"
      - "${APEX_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      target: development
    env_file:
      - .env
    environment:
      APEX_BACKEND_HOST: 0.0.0.0
      APEX_BACKEND_PORT: 8000
      # Assembled from the POSTGRES_* values so credentials have one source of
      # truth, and pointed at the service name rather than localhost.
      APEX_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-apex}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-apex}
      # Service name inside the compose network, not localhost.
      APEX_S3_ENDPOINT: http://minio:9000
    ports:
      - "${APEX_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/srv/apex
      # Keep the image's virtualenv from being shadowed by the bind mount.
      - /srv/apex/.venv
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_APEX_API_BASE_URL: ${VITE_APEX_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/srv/apex
      # Use the image's node_modules rather than the host's.
      - /srv/apex/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
  minio-data:
